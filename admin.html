<!doctype html>
<html lang="vi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - DeutschFlow</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head>
<body class="admin-page"><header class="admin-topbar"><a class="brand" href="home.html"><span class="brand-mark">D</span><strong>DeutschFlow</strong></a><div><span class="admin-pill">ADMIN</span><button id="adminLogout" class="logout-btn">Đăng xuất</button></div></header>
<main class="admin-main"><div class="admin-heading"><div><p class="eyebrow">QUẢN TRỊ HỆ THỐNG</p><h1>Trung tâm quản lý</h1><p>Quản lý học viên, tiến độ và nội dung tiếng Đức.</p></div><button id="refreshAdmin" class="outline-btn">↻ Làm mới</button></div>
<section class="admin-stats"><article><span>Học viên</span><strong id="adminUsersCount">0</strong></article><article><span>Từ vựng</span><strong id="adminWordsCount">0</strong></article><article><span>Tiến độ đã ghi</span><strong id="adminProgressCount">0</strong></article></section>
<div class="admin-grid"><section class="admin-card"><div class="admin-card-heading"><div><p class="eyebrow">TÀI KHOẢN</p><h2>Người dùng</h2></div><input id="userSearch" class="admin-search" placeholder="Tìm username..."></div><div class="admin-table-wrap"><table><thead><tr><th>Username</th><th>Ngày tạo</th><th>Vai trò</th><th></th></tr></thead><tbody id="usersTable"></tbody></table></div></section>
<section class="admin-card"><div class="admin-card-heading"><div><p class="eyebrow">NỘI DUNG</p><h2>Từ vựng tiếng Đức</h2></div><button id="newWordBtn" class="primary-btn">+ Thêm từ</button></div><form id="wordForm" class="word-admin-form hidden"><input id="wordId" type="hidden"><input id="wordGerman" placeholder="Từ tiếng Đức" required><input id="wordVietnamese" placeholder="Nghĩa tiếng Việt" required><input id="wordPronunciation" placeholder="Phát âm"><div><button class="primary-btn" type="submit">Lưu từ</button><button id="cancelWordBtn" class="outline-btn" type="button">Hủy</button></div></form><div id="wordsList" class="admin-word-list"></div></section></div><p id="adminMessage" class="auth-message"></p></main><div id="toast" class="toast"></div><script src="script.js"></script></body></html>
